<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作助手">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="医药代表日常工作管理助手">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<title>工作助手</title>
<style>
:root {
  --bg:#F0F2F5;--card:#FFFFFF;--text:#1A1A2E;--text2:#6B7280;
  --text3:#9CA3AF;--border:#E5E7EB;--accent:#059669;--accent-light:#D1FAE5;
  --red:#EF4444;--orange:#F59E0B;--green:#10B981;--purple:#8B5CF6;--blue:#3B82F6;
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 10px 25px rgba(0,0,0,.08);
  --radius:12px;--radius-sm:8px;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{outline:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;width:100%;background:var(--bg);color:var(--text);transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:768px;margin:0 auto;position:relative;overflow:hidden}

/* 顶部 */
.header{
  background:linear-gradient(135deg,var(--accent),#047857);color:#fff;
  padding:24px 20px;padding-top:max(32px,env(safe-area-inset-top,28px));
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:100;box-shadow:0 2px 10px rgba(5,150,105,.3);
}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
.header-date{font-size:13px;opacity:.85}

.pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.page{display:none;padding:16px}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-title{font-weight:700;font-size:16px}
.card-body{padding:12px 16px}

/* 按钮 */
.btn{padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{transform:scale(.95)}
.btn-outline{border:1px solid var(--accent);color:var(--accent);background:var(--card)}
.btn-outline:active{background:var(--accent-light)}
.btn-danger{color:var(--red);border:1px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%;display:block;text-align:center}

/* 底部导航 */
.bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--safe-bottom);
  box-shadow:0 -2px 10px rgba(0,0,0,.04);z-index:200;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--text3);transition:color .2s}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:22px}
.nav-label{font-size:11px}

/* 概览卡片 */
.overview{background:linear-gradient(135deg,var(--accent),#047857);border-radius:var(--radius);padding:24px 20px;color:#fff;margin-bottom:16px;box-shadow:0 4px 15px rgba(5,150,105,.25)}
.overview-label{font-size:13px;opacity:.8;margin-bottom:4px}
.overview-value{font-size:32px;font-weight:700;letter-spacing:-1px}
.overview-stats{display:flex;gap:16px;margin-top:16px}
.overview-stat{flex:1}
.overview-stat-label{font-size:12px;opacity:.8}
.overview-stat-value{font-size:16px;font-weight:600;margin-top:2px}

/* 列表条目 */
.list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .15s}
.list-item:active{background:var(--bg)}
.list-item:last-child{border-bottom:none}
.list-avatar{width:40px;height:40px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:var(--accent);font-weight:700}
.list-info{flex:1;min-width:0}
.list-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:12px;color:var(--text2);margin-top:2px}
.list-right{text-align:right;flex-shrink:0}
.list-right-value{font-weight:700;font-size:15px}
.list-right-sub{font-size:12px;margin-top:2px}

/* 统计行 */
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-value{font-size:20px;font-weight:700}
.stat-label{font-size:11px;color:var(--text2);margin-top:2px}

/* 表单 */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
textarea{resize:vertical;min-height:80px}

/* 模态弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:700}

/* 空状态 */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:2000;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translateX(-50%)}}

/* 标签 */
.tag-chip{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-right:4px}
.tag-chip-removable{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--accent-light);color:var(--accent)}
.tag-chip-removable button{font-size:14px;color:var(--accent);padding:0;line-height:1}

/* 筛选 */
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 搜索框 */
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:12px}
.search-box input{border:none;background:none;padding:0;flex:1}
.search-box svg{width:18px;height:18px;color:var(--text3);flex-shrink:0}

/* 任务状态色 */
.priority-high{color:var(--red)}
.priority-mid{color:var(--orange)}
.priority-low{color:var(--blue)}
.status-done{text-decoration:line-through;color:var(--text3)}

/* 设置项 */
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.setting-item:last-child{border-bottom:none}
.setting-label{font-weight:600;font-size:15px}
.setting-desc{font-size:12px;color:var(--text3);margin-top:2px}

/* 同步状态 */
.sync-status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.sync-status.on{background:var(--accent-light);color:var(--accent)}
.sync-status.off{background:#FEE2E2;color:var(--red)}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1 id="headerTitle">工作助手</h1>
  <span class="header-date" id="headerDate"></span>
</div>

<div class="pages" id="pages">

  <!-- ===== 概览 ===== -->
  <div class="page active" id="page-overview">
    <div class="overview" id="overviewCard">
      <div class="overview-label">今日工作</div>
      <div class="overview-value" id="todaySummary">0 项待办</div>
      <div class="overview-stats">
        <div class="overview-stat">
          <div class="overview-stat-label">今日任务</div>
          <div class="overview-stat-value" id="statTodayTasks">0</div>
        </div>
        <div class="overview-stat">
          <div class="overview-stat-label">待办总数</div>
          <div class="overview-stat-value" id="statPending">0</div>
        </div>
        <div class="overview-stat">
          <div class="overview-stat-label">客户总数</div>
          <div class="overview-stat-value" id="statCustomers">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 今日任务</span>
        <button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ 添加</button>
      </div>
      <div id="todayTaskList"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">🗓️ 今日日程</span>
        <button class="btn btn-outline btn-sm" onclick="switchPage('schedule')">查看</button>
      </div>
      <div id="todayScheduleList"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 近期拜访</span>
        <button class="btn btn-outline btn-sm" onclick="switchPage('visits')">查看</button>
      </div>
      <div id="recentVisitList"></div>
    </div>
  </div>

  <!-- ===== 任务 ===== -->
  <div class="page" id="page-tasks">
    <div class="filter-row" id="taskStatusFilter">
      <button class="filter-chip active" data-f="all" onclick="setTaskFilter('all',this)">全部</button>
      <button class="filter-chip" data-f="todo" onclick="setTaskFilter('todo',this)">待办</button>
      <button class="filter-chip" data-f="done" onclick="setTaskFilter('done',this)">已完成</button>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">📋 任务列表</span>
        <button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ 新建</button>
      </div>
      <div id="taskList"></div>
    </div>
  </div>

  <!-- ===== 日程 ===== -->
  <div class="page" id="page-schedule">
    <div class="card">
      <div class="card-header">
        <span class="card-title">🗓️ 日程安排</span>
        <button class="btn btn-primary btn-sm" onclick="openScheduleModal()">+ 新建</button>
      </div>
      <div class="card-body">
        <input type="date" id="scheduleDate" onchange="renderSchedule()" style="margin-bottom:12px">
      </div>
      <div id="scheduleList"></div>
    </div>
  </div>

  <!-- ===== 客户 ===== -->
  <div class="page" id="page-customers">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="customerSearch" placeholder="搜索姓名/医院/科室/产品..." oninput="renderCustomers()">
    </div>
    <div class="filter-row" id="customerStageFilter">
      <button class="filter-chip active" data-s="all" onclick="setStageFilter('all',this)">全部</button>
      <button class="filter-chip" data-s="意向" onclick="setStageFilter('意向',this)">意向</button>
      <button class="filter-chip" data-s="重点" onclick="setStageFilter('重点',this)">重点</button>
      <button class="filter-chip" data-s="已合作" onclick="setStageFilter('已合作',this)">已合作</button>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 客户资料</span>
        <button class="btn btn-primary btn-sm" onclick="openCustomerModal()">+ 新建</button>
      </div>
      <div id="customerList"></div>
    </div>
  </div>

  <!-- ===== 拜访记录 ===== -->
  <div class="page" id="page-visits">
    <div class="card">
      <div class="card-header">
        <span class="card-title">📝 拜访记录</span>
        <button class="btn btn-primary btn-sm" onclick="openVisitModal()">+ 记录</button>
      </div>
      <div id="visitList"></div>
    </div>
  </div>

  <!-- ===== 设置 ===== -->
  <div class="page" id="page-settings">
    <div class="card">
      <div class="card-header"><span class="card-title">☁️ 云端同步</span></div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span id="syncStatus" class="sync-status off">未连接</span>
        </div>
        <div class="form-group">
          <label class="form-label">GitHub Token</label>
          <input type="password" id="syncTokenInput" placeholder="输入 GitHub Token 以启用云端同步">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" onclick="saveSyncToken()">保存Token</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-outline" style="flex:1" onclick="pushToCloud()">☁️ 同步到云端</button>
          <button class="btn btn-outline" style="flex:1" onclick="pullFromCloud()">⬇️ 从云端拉取</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">ℹ️ 关于</span></div>
      <div class="card-body" style="color:var(--text2);font-size:13px">
        <p>工作助手 · 医药代表日常工作管理</p>
        <p style="margin-top:4px">数据默认保存在手机本地，建议开启云端同步防止丢失。</p>
        <p style="margin-top:4px;color:var(--text3)">版本 v2.0</p>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="overview" onclick="switchPage('overview')">
    <span class="nav-icon">🏠</span><span class="nav-label">概览</span>
  </button>
  <button class="nav-item" data-page="tasks" onclick="switchPage('tasks')">
    <span class="nav-icon">📋</span><span class="nav-label">任务</span>
  </button>
  <button class="nav-item" data-page="schedule" onclick="switchPage('schedule')">
    <span class="nav-icon">🗓️</span><span class="nav-label">日程</span>
  </button>
  <button class="nav-item" data-page="customers" onclick="switchPage('customers')">
    <span class="nav-icon">👥</span><span class="nav-label">客户</span>
  </button>
  <button class="nav-item" data-page="settings" onclick="switchPage('settings')">
    <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
  </button>
</nav>

</div>

<div id="modalContainer"></div>

<script>
// ==================== 数据存储 ====================
const DB = {
  get(k){ try{ return JSON.parse(localStorage.getItem('wa_'+k))||[] }catch(e){ return [] } },
  set(k,v){ localStorage.setItem('wa_'+k, JSON.stringify(v)) },
  genId(){ return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,8) }
};

const SYNC_KEY = 'wa_sync_token';
const REPO = 'cjmlyd/workbox';

// ==================== 工具函数 ====================
function escHtml(s){ return (s||'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])) }
function escAttr(s){ return (s||'').replace(/"/g,'&quot;') }
function todayStr(){ return new Date().toISOString().slice(0,10) }
function fmtDate(d){ if(!d) return ''; return d; }
function formatDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}

// ==================== Toast ====================
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300) },2000);
}

// ==================== 页面切换 ====================
const PAGE_TITLES = {overview:'工作助手',tasks:'任务',schedule:'日程',customers:'客户',visits:'拜访记录',settings:'设置'};
function switchPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target = document.getElementById('page-'+name);
  if(target) target.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav = document.querySelector('.nav-item[data-page="'+name+'"]');
  if(nav) nav.classList.add('active');
  document.getElementById('headerTitle').textContent = PAGE_TITLES[name]||'工作助手';
  if(name==='overview') renderOverview();
  if(name==='tasks') renderTasks();
  if(name==='schedule') renderSchedule();
  if(name==='customers') renderCustomers();
  if(name==='visits') renderVisits();
  if(name==='settings') updateSyncUI();
}

// ==================== 模态弹窗 ====================
function openModal(title, bodyHtml, onSave, saveText){
  const html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal">'+
      '<div class="modal-header">'+
        '<span class="modal-title">'+escHtml(title)+'</span>'+
        '<button onclick="closeModal()" style="font-size:24px;color:var(--text3)">✕</button>'+
      '</div>'+
      '<div>'+bodyHtml+'</div>'+
      '<div style="display:flex;gap:10px;margin-top:20px">'+
        '<button class="btn btn-outline btn-block" onclick="closeModal()">取消</button>'+
        '<button class="btn btn-primary btn-block" id="modalSaveBtn">'+(saveText||'保存')+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';
  document.getElementById('modalContainer').innerHTML = html;
  setTimeout(()=>{
    const btn = document.getElementById('modalSaveBtn');
    if(btn) btn.onclick = function(){ if(onSave) onSave(); };
  },50);
}
function closeModal(){ document.getElementById('modalContainer').innerHTML=''; }

// ==================== 筛选状态 ====================
let taskFilter = 'all';
let stageFilter = 'all';

function setTaskFilter(f, el){
  taskFilter = f;
  document.querySelectorAll('#taskStatusFilter .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}
function setStageFilter(s, el){
  stageFilter = s;
  document.querySelectorAll('#customerStageFilter .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderCustomers();
}

// ==================== 任务管理 ====================
function getTasks(){ return DB.get('tasks'); }
function getTodayTasks(){
  const today = todayStr();
  return getTasks().filter(t => t.dueDate === today);
}
function addTask(data){
  const tasks = getTasks();
  tasks.push(Object.assign({id:DB.genId(), status:'todo', created:Date.now()}, data));
  DB.set('tasks', tasks);
}
function updateTask(id, patch){
  const tasks = getTasks();
  const t = tasks.find(x=>x.id===id);
  if(t) Object.assign(t, patch);
  DB.set('tasks', tasks);
}
function deleteTask(id){
  DB.set('tasks', getTasks().filter(t=>t.id!==id));
}
function toggleTask(id){
  const t = getTasks().find(x=>x.id===id);
  if(t) updateTask(id, {status: t.status==='done'?'todo':'done'});
}
function openTaskModal(editId){
  const t = editId ? getTasks().find(x=>x.id===editId) : null;
  const body = '<div class="form-group"><label class="form-label">任务名称</label>'+
    '<input type="text" id="taskTitle" placeholder="如：拜访XX医院" value="'+escAttr(t?t.title:'')+'"></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">截止日期</label>'+
    '<input type="date" id="taskDue" value="'+escAttr(t?t.dueDate:todayStr())+'"></div>'+
    '<div class="form-group"><label class="form-label">优先级</label>'+
    '<select id="taskPriority"><option value="high"'+(t&&t.priority==='high'?' selected':'')+'>高</option>'+
    '<option value="mid"'+(t&&t.priority==='mid'?' selected':'')+'>中</option>'+
    '<option value="low"'+(t&&t.priority==='low'?' selected':'')+'>低</option></select></div></div>'+
    '<div class="form-group"><label class="form-label">备注</label>'+
    '<textarea id="taskNote" placeholder="可选">'+escHtml(t?t.note:'')+'</textarea></div>';
  openModal(editId?'编辑任务':'新建任务', body, function(){
    const title = document.getElementById('taskTitle').value.trim();
    if(!title){ toast('请输入任务名称'); return; }
    const data = {
      title:title,
      dueDate: document.getElementById('taskDue').value,
      priority: document.getElementById('taskPriority').value,
      note: document.getElementById('taskNote').value.trim()
    };
    if(editId) updateTask(editId, data); else addTask(data);
    closeModal(); renderTasks(); renderOverview(); toast(editId?'已更新':'已添加');
  });
}
function renderTasks(){
  let tasks = getTasks();
  if(taskFilter==='todo') tasks = tasks.filter(t=>t.status!=='done');
  if(taskFilter==='done') tasks = tasks.filter(t=>t.status==='done');
  tasks.sort((a,b)=>{ if(a.dueDate!==b.dueDate) return (a.dueDate||'').localeCompare(b.dueDate||''); return (b.created||0)-(a.created||0); });
  const el = document.getElementById('taskList');
  if(!tasks.length){ el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无任务</div></div>'; return; }
  el.innerHTML = tasks.map(t=>{
    const pColor = t.priority==='high'?'priority-high':(t.priority==='mid'?'priority-mid':'priority-low');
    const pLabel = t.priority==='high'?'🔴高':(t.priority==='mid'?'🟡中':'🔵低');
    const doneCls = t.status==='done'?'status-done':'';
    return '<div class="list-item">'+
      '<button class="nav-icon" style="background:none;font-size:22px" onclick="toggleTask(\''+t.id+'\')">'+(t.status==='done'?'✅':'⬜')+'</button>'+
      '<div class="list-info">'+
        '<div class="list-name '+doneCls+'">'+escHtml(t.title)+'</div>'+
        '<div class="list-meta">'+(t.dueDate?formatDate(t.dueDate)+' · ':'')+pLabel+(t.note?' · '+escHtml(t.note):'')+'</div>'+
      '</div>'+
      '<button class="btn btn-sm" onclick="openTaskModal(\''+t.id+'\')" style="color:var(--text3)">✏️</button>'+
    '</div>';
  }).join('');
}

// ==================== 日程管理 ====================
function getSchedules(){ return DB.get('schedules'); }
function addSchedule(data){
  const s = getSchedules();
  s.push(Object.assign({id:DB.genId(), created:Date.now()}, data));
  DB.set('schedules', s);
}
function deleteSchedule(id){ DB.set('schedules', getSchedules().filter(s=>s.id!==id)); }
function openScheduleModal(){
  const today = document.getElementById('scheduleDate').value || todayStr();
  const body = '<div class="form-group"><label class="form-label">日期</label>'+
    '<input type="date" id="schDate" value="'+today+'"></div>'+
    '<div class="form-group"><label class="form-label">时间段</label>'+
    '<select id="schTime"><option value="上午">上午</option><option value="下午">下午</option><option value="全天">全天</option></select></div>'+
    '<div class="form-group"><label class="form-label">内容</label>'+
    '<input type="text" id="schTitle" placeholder="如：科室会/产品培训"></div>'+
    '<div class="form-group"><label class="form-label">地点/客户</label>'+
    '<input type="text" id="schLocation" placeholder="可选"></div>';
  openModal('新建日程', body, function(){
    const title = document.getElementById('schTitle').value.trim();
    if(!title){ toast('请输入内容'); return; }
    addSchedule({
      date: document.getElementById('schDate').value,
      time: document.getElementById('schTime').value,
      title: title,
      location: document.getElementById('schLocation').value.trim()
    });
    closeModal(); renderSchedule(); renderOverview(); toast('已添加');
  });
}
function renderSchedule(){
  const date = document.getElementById('scheduleDate').value || todayStr();
  document.getElementById('scheduleDate').value = date;
  let items = getSchedules().filter(s=>s.date===date);
  const el = document.getElementById('scheduleList');
  if(!items.length){ el.innerHTML = '<div class="empty-state"><div class="empty-icon">🗓️</div><div class="empty-text">当天没有日程</div></div>'; return; }
  items.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  el.innerHTML = items.map(s=>{
    return '<div class="list-item">'+
      '<div class="list-avatar">🗓️</div>'+
      '<div class="list-info">'+
        '<div class="list-name">'+escHtml(s.title)+'</div>'+
        '<div class="list-meta">'+escHtml(s.time||'')+(s.location?' · '+escHtml(s.location):'')+'</div>'+
      '</div>'+
      '<button class="btn btn-sm btn-danger" onclick="deleteSchedule(\''+s.id+'\');renderSchedule();renderOverview()">删除</button>'+
    '</div>';
  }).join('');
}

// ==================== 客户管理 ====================
function getCustomers(){ return DB.get('customers'); }
function addCustomer(data){
  const c = getCustomers();
  c.push(Object.assign({id:DB.genId(), created:Date.now()}, data));
  DB.set('customers', c);
}
function updateCustomer(id, patch){
  const c = getCustomers();
  const item = c.find(x=>x.id===id);
  if(item) Object.assign(item, patch);
  DB.set('customers', c);
}
function deleteCustomer(id){ DB.set('customers', getCustomers().filter(c=>c.id!==id)); }

    '<div class="form-group"><label class="form-label">阶段</label>'+
    '<select id="cStage"><option value="意向"'+(c&&c.stage==='意向'?' selected':'')+'>意向</option>'+

    '<option value="已合作"'+(c&&c.stage==='已合作'?' selected':'')+'>已合作</option></select></div></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">医院</label>'+
    '<input type="text" id="cHospital" placeholder="医院名称" value="'+escAttr(c?c.hospital:'')+'"></div>'+
    '<div class="form-group"><label class="form-label">科室</label>'+
    '<input type="text" id="cDept" placeholder="科室" value="'+escAttr(c?c.department:'')+'"></div></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">电话</label>'+
    '<input type="tel" id="cPhone" placeholder="手机号" value="'+escAttr(c?c.phone:'')+'"></div>'+
    '<div class="form-group"><label class="form-label">微信</label>'+
    '<input type="text" id="cWechat" placeholder="微信号" value="'+escAttr(c?c.wechat:'')+'"></div></div>'+
    '<div class="form-group"><label class="form-label">推广产品</label>'+
    '<input type="text" id="cProduct" placeholder="如：XX药物" value="'+escAttr(c?c.product:'')+'"></div>'+
    '<div class="form-group"><label class="form-label">备注/画像</label>'+
    '<textarea id="cProfile" placeholder="客户特点、偏好等">'+escHtml(c?c.profile:'')+'</textarea></div>';
  openModal(editId?'编辑客户':'新建客户', body, function(){
    const name = document.getElementById('cName').value.trim();
    if(!name){ toast('请输入客户姓名'); return; }
    const data = {
      name: name,
      title: document.getElementById('cTitle').value.trim(),
      stage: document.getElementById('cStage').value,
      hospital: document.getElementById('cHospital').value.trim(),
      department: document.getElementById('cDept').value.trim(),
      phone: document.getElementById('cPhone').value.trim(),
      wechat: document.getElementById('cWechat').value.trim(),
      product: document.getElementById('cProduct').value.trim(),
      profile: document.getElementById('cProfile').value.trim()
    };
    if(editId) updateCustomer(editId, data); else addCustomer(data);
    closeModal(); renderCustomers(); renderOverview(); toast(editId?'已更新':'已添加');
  });
}
function renderCustomers(){
  const kw = (document.getElementById('customerSearch').value||'').toLowerCase();
  let list = getCustomers();
  if(stageFilter!=='all') list = list.filter(c=>c.stage===stageFilter);
  if(kw){
    list = list.filter(c=>{
      const s = [c.name,c.title,c.hospital,c.department,c.phone,c.wechat,c.product,c.profile].join(' ').toLowerCase();
      return s.indexOf(kw)>=0;
    });
  }
  const el = document.getElementById('customerList');
  if(!list.length){ el.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">暂无客户</div></div>'; return; }
  el.innerHTML = list.map(c=>{
    const stageColor = c.stage==='已合作'?'var(--accent)':(c.stage==='重点'?'var(--orange)':'var(--blue)');
    const initials = (c.name||'?').slice(0,1);
    return '<div class="list-item" onclick="openCustomerModal(\''+c.id+'\')">'+
      '<div class="list-avatar">'+escHtml(initials)+'</div>'+
      '<div class="list-info">'+
        '<div class="list-name">'+escHtml(c.name)+(c.title?' · '+escHtml(c.title):'')+'</div>'+
        '<div class="list-meta">'+escHtml(c.hospital||'')+(c.department?' · '+escHtml(c.department):'')+(c.product?' · '+escHtml(c.product):'')+'</div>'+
      '</div>'+
      '<div class="list-right">'+
        '<span class="tag-chip" style="background:'+stageColor+'22;color:'+stageColor+'">'+escHtml(c.stage||'')+'</span>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ==================== 概览 ====================
function renderOverview(){
  const tasks = getTasks();
  const todayTasks = tasks.filter(t=>t.dueDate===todayStr());
  const pending = tasks.filter(t=>t.status!=='done');
  const customers = getCustomers();
  const visits = getVisits();

  document.getElementById('todaySummary').textContent = todayTasks.filter(t=>t.status!=='done').length + ' 项今日待办';
  document.getElementById('statTodayTasks').textContent = todayTasks.length;
  document.getElementById('statPending').textContent = pending.length;
  document.getElementById('statCustomers').textContent = customers.length;

  // 今日任务
  const tEl = document.getElementById('todayTaskList');
  if(todayTasks.length){
    tEl.innerHTML = todayTasks.map(t=>{
      return '<div class="list-item">'+
        '<button class="nav-icon" style="background:none;font-size:22px" onclick="toggleTask(\''+t.id+'\');renderOverview()">'+(t.status==='done'?'✅':'⬜')+'</button>'+
        '<div class="list-info"><div class="list-name '+(t.status==='done'?'status-done':'')+'">'+escHtml(t.title)+'</div>'+
        '<div class="list-meta">'+(t.priority==='high'?'🔴高':(t.priority==='mid'?'🟡中':'🔵低'))+'</div></div>'+
        '<button class="btn btn-sm" onclick="openTaskModal(\''+t.id+'\');renderOverview()" style="color:var(--text3)">✏️</button>'+
      '</div>';
    }).join('');
  } else {
    tEl.innerHTML = '<div class="empty-state"><div class="empty-text">今天没有任务，去看看全部任务</div></div>';
  }

  // 今日日程
  const sEl = document.getElementById('todayScheduleList');
  const todaySched = getSchedules().filter(s=>s.date===todayStr());
  if(todaySched.length){
    sEl.innerHTML = todaySched.map(s=>'<div class="list-item"><div class="list-avatar">🗓️</div>'+
      '<div class="list-info"><div class="list-name">'+escHtml(s.title)+'</div>'+
      '<div class="list-meta">'+escHtml(s.time||'')+(s.location?' · '+escHtml(s.location):'')+'</div></div></div>').join('');
  } else {
    sEl.innerHTML = '<div class="empty-state"><div class="empty-text">今天没有日程安排</div></div>';
  }

  // 近期拜访
  const vEl = document.getElementById('recentVisitList');
  const recentVisits = visits.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3);
  if(recentVisits.length){
    vEl.innerHTML = recentVisits.map(v=>'<div class="list-item"><div class="list-avatar">'+(v.type==='电话'?'📞':(v.type==='微信'?'💬':'🚶'))+'</div>'+
      '<div class="list-info"><div class="list-name">'+escHtml(v.customer)+'</div>'+
      '<div class="list-meta">'+escHtml(v.date)+' · '+escHtml(v.type||'')+'</div></div></div>').join('');
  } else {
    vEl.innerHTML = '<div class="empty-state"><div class="empty-text">暂无拜访记录</div></div>';
  }
}

// ==================== 云端同步 ====================
function getSyncToken(){ return localStorage.getItem(SYNC_KEY); }
function saveSyncToken(){
  const token = document.getElementById('syncTokenInput').value.trim();
  if(!token){ toast('请输入Token'); return; }
  localStorage.setItem(SYNC_KEY, token);
  updateSyncUI();
  toast('Token已保存');
}
function updateSyncUI(){
  const token = getSyncToken();
  const el = document.getElementById('syncStatus');
  const input = document.getElementById('syncTokenInput');
  if(token){
    el.className = 'sync-status on';
    el.textContent = '已连接';
    if(input && !input.value) input.value = token;
  } else {
    el.className = 'sync-status off';
    el.textContent = '未连接';
  }
}
async function githubAPI(method, path, body){
  const token = getSyncToken();
  if(!token) throw new Error('未配置Token');
  const headers = {'Authorization':'token '+token, 'Accept':'application/vnd.github+json'};
  const opts = {method, headers};
  if(body){ headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const resp = await fetch('https://api.github.com/repos/'+REPO+'/'+path, opts);
  if(!resp.ok){ const e = await resp.text(); throw new Error(e.slice(0,200)); }
  return resp.json();
}
async function pushToCloud(){
  const token = getSyncToken();
  if(!token){ toast('请先在设置中配置Token'); return; }
  toast('正在同步到云端...');
  try {
    const keys = ['tasks','schedules','customers','visits'];
    const allData = {};
    keys.forEach(k => { allData[k] = DB.get(k); });
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(allData, null, 2))));
    let sha = null;
    try { const existing = await githubAPI('GET','contents/data.json'); sha = existing.sha; } catch(e){}
    await githubAPI('PUT','contents/data.json', {
      message: '工作助手数据同步 ' + new Date().toLocaleString('zh-CN'),
      content: content,
      branch: 'main'
    });
    if(sha) {} // 更新已有文件
    toast('✅ 已同步到云端');
  } catch(e){
    toast('同步失败: ' + e.message.slice(0,80));
  }
}
async function pullFromCloud(){
  const token = getSyncToken();
  if(!token){ toast('请先在设置中配置Token'); return; }
  toast('正在从云端拉取...');
  try {
    const result = await githubAPI('GET','contents/data.json');
    if(result.content){
      const data = JSON.parse(atob(result.content));
      ['tasks','schedules','customers','visits'].forEach(k => {
        if(data[k] !== undefined) DB.set(k, data[k]);
      });
      toast('✅ 已从云端拉取');
      renderOverview(); renderTasks(); renderSchedule(); renderCustomers(); renderVisits();
    } else {
      toast('云端暂无数据');
    }
  } catch(e){
    toast('拉取失败: ' + e.message.slice(0,80));
  }
}

// ==================== 初始化 ====================
function init(){
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  document.getElementById('scheduleDate').value = todayStr();
  renderOverview();
  updateSyncUI();
  // 如果有token，启动时自动拉取
  if(getSyncToken()){
    pullFromCloud();
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
